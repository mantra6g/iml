# Experiment 1 — third NF. Only used when running with slot limit N >= 3
# (raise --max-nf-slots in bmv2_util.go and rebuild the operator first).
apiVersion: core.loom.io/v1alpha1
kind: NetworkFunction
metadata:
  name: exp1-nf-3
  namespace: default
  labels:
    experiment: exp1
spec:
  p4File: "https://raw.githubusercontent.com/mantra6g/iml/refs/heads/main/examples/simple/logger.p4"
  targetSelector:
    p4target.loom.io/arch: v1model
