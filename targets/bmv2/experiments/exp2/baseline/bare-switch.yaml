# Experiment 2 — a throwaway BMv2 switch for the direct-gRPC baseline.
#
# This is a bare simple_switch_grpc with NO driver, NO operator, and NO
# P4Runtime master holding it. The baseline tool (experiments/exp2/baseline)
# arbitrates as primary and pushes the pipeline directly, so the measurement is
# the pure data-plane programming cost — the floor that full NF convergence is
# compared against.
#
# Reach it with:  kubectl port-forward pod/bmv2-baseline-switch 9559:9559
apiVersion: v1
kind: Pod
metadata:
  name: bmv2-baseline-switch
  namespace: default
  labels:
    experiment: exp2
    role: baseline-switch
spec:
  restartPolicy: Never
  containers:
    - name: bmv2-switch
      image: p4lang/behavioral-model:latest
      imagePullPolicy: IfNotPresent
      command: ["simple_switch_grpc"]
      # No interfaces are needed to install a pipeline; the gRPC server alone is
      # enough for SetForwardingPipelineConfig.
      args:
        - "--no-p4"
        - "--log-console"
        - "--"
        - "--grpc-server-addr=0.0.0.0:9559"
        - "--cpu-port=255"
      ports:
        - containerPort: 9559
          name: p4runtime
