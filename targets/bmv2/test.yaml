apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: bmv2-driver
rules:
- apiGroups: ["core.loom.io", "infra.loom.io", "scheduling.loom.io"]
  resources: ["*"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: bmv2-driver
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: bmv2-driver
subjects:
- kind: ServiceAccount
  name: default
  namespace: default
---
apiVersion: v1
kind: Service
metadata:
  name: bmv2-driver
spec:
  selector:
    app: bmv2-driver
  ports:
  - port: 8080
    targetPort: 8080
---
# The daemon reads the P4Target's network configuration when the CNI plugin sets up the pod, so it
# must exist first. The BMv2Target controller creates the same object for its pods.
apiVersion: core.loom.io/v1alpha1
kind: P4Target
metadata:
  name: web-client
  labels:
    p4target.loom.io/arch: v1model
spec:
  network:
    hostInterfaces:
      strategy: Create
      create:
        count: 1
---
apiVersion: v1
kind: Pod
metadata:
  name: bmv2-test
  labels:
    app: bmv2-driver
  annotations:
    k8s.v1.cni.cncf.io/networks: |
      [
        {
          "name": "loom-cni",
          "namespace": "loom-system",
          "cni-args": {
            "app_type": "p4target",
            "target_name": "web-client"
          }
        }
      ]
spec:
  restartPolicy: OnFailure
  containers:
  - name: bmv2-driver
    image: mantra6g/bmv2-driver:latest
    imagePullPolicy: Never
    args: ["--p4target-name=web-client"]
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
    env:
    - name: POD_NAME
      valueFrom:
        fieldRef:
          fieldPath: metadata.name
    - name: POD_NAMESPACE
      valueFrom:
        fieldRef:
          fieldPath: metadata.namespace
  - name: bmv2-switch
    image: p4lang/behavioral-model:latest
    imagePullPolicy: IfNotPresent
    securityContext:
      capabilities:
        add: ["NET_RAW"]
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
    command: ["simple_switch_grpc"]
    args:
      - "--no-p4"
      - "--log-console"
      - "-i"
      - "0@nf0"
      - "--"
      - "--grpc-server-addr=0.0.0.0:9559"
      - "--cpu-port=255"
