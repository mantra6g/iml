apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: cni-plugins-installer
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app: cni-plugins-installer
  template:
    metadata:
      labels:
        app: cni-plugins-installer
    spec:
      tolerations:
      - operator: Exists
      containers:
      - name: installer
        image: alpine:3.19
        command: ["/bin/sh", "-c"]
        args:
          - |
            set -e
            if [ ! -f /host/opt/cni/bin/bridge ]; then
              ARCH=$(uname -m)
              case $ARCH in
                x86_64)  ARCH=amd64 ;;
                aarch64) ARCH=arm64 ;;
              esac
              mkdir -p /host/opt/cni/bin
              wget -qO- https://github.com/containernetworking/plugins/releases/download/v1.6.2/cni-plugins-linux-${ARCH}-v1.6.2.tgz | tar -xz -C /host/opt/cni/bin
            fi
            exec sleep infinity
        volumeMounts:
        - name: cni-bin
          mountPath: /host/opt/cni/bin
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
      volumes:
      - name: cni-bin
        hostPath:
          path: /opt/cni/bin
          type: DirectoryOrCreate
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: bmv2-driver
rules:
- apiGroups: ["core.loom.io", "infra.loom.io", "scheduling.loom.io"]
  resources: ["*"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: bmv2-driver
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: bmv2-driver
subjects:
- kind: ServiceAccount
  name: default
  namespace: default
---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: iml0-net
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "name": "iml0-net",
      "type": "bridge",
      "bridge": "iml0-br",
      "ipam": {
        "type": "static",
        "addresses": [{"address": "10.0.1.1/24"}]
      }
    }
---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: nf0-net
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "name": "nf0-net",
      "type": "bridge",
      "bridge": "nf0-br",
      "ipam": {
        "type": "static",
        "addresses": [{"address": "10.0.2.1/24"}]
      }
    }
---
apiVersion: v1
kind: Pod
metadata:
  name: bmv2-test
  annotations:
    k8s.v1.cni.cncf.io/networks: '[{"name":"iml0-net","interface":"iml0"},{"name":"nf0-net","interface":"nf0"}]'
spec:
  restartPolicy: OnFailure
  containers:
  - name: bmv2-driver
    image: bmv2-driver:local
    imagePullPolicy: Never
    args: ["--data-iface=iml0,nf0"]
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
  - name: bmv2-switch
    image: p4lang/behavioral-model:latest
    imagePullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
    command: ["simple_switch_grpc"]
    args:
      - "--no-p4"
      - "--log-console"
      - "-i"
      - "0@iml0"
      - "-i"
      - "1@nf0"
      - "--"
      - "--grpc-server-addr=0.0.0.0:9559"
      - "--cpu-port=255"
