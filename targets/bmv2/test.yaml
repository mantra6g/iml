apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: bmv2-driver
rules:
- apiGroups: ["core.loom.io", "infra.loom.io", "scheduling.loom.io"]
  resources: ["*"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: bmv2-driver
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: bmv2-driver
subjects:
- kind: ServiceAccount
  name: default
  namespace: default
---
apiVersion: v1
kind: Pod
metadata:
  name: bmv2-test
spec:
  restartPolicy: OnFailure
  containers:
  - name: bmv2-driver
    image: bmv2-driver:local
    imagePullPolicy: Never
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
  - name: bmv2-switch
    image: p4lang/behavioral-model:latest
    imagePullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
    command: ["simple_switch_grpc"]
    args:
      - "--no-p4"
      - "--log-console"
      - "--"
      - "--grpc-server-addr=0.0.0.0:9559"
      - "--cpu-port=255"
