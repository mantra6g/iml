apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    app.kubernetes.io/name: bmv2-target
    app.kubernetes.io/managed-by: kustomize
  name: bmv2-driver-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: bmv2-driver-role
subjects:
  - kind: ServiceAccount
    name: bmv2-driver
    namespace: system
