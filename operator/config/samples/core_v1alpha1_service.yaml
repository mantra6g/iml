apiVersion: core.loom.io/v1alpha1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: loom-operator
    app.kubernetes.io/managed-by: kustomize
  name: service-sample
spec:
  # Reachable at service-sample--<namespace>.loom-system.svc.cluster.local
  type: ClusterIP
  selector:
    app: service-sample
  ports:
  - name: http
    protocol: TCP
    port: 8080
