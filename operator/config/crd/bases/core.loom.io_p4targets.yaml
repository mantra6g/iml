---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: p4targets.core.loom.io
spec:
  group: core.loom.io
  names:
    kind: P4Target
    listKind: P4TargetList
    plural: p4targets
    shortNames:
    - targets
    - target
    singular: p4target
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: P4Target is the Schema for the p4targets API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of P4Target
            properties:
              network:
                default: {}
                description: Network configures how the host connects to the P4 target
                  and handles its SRv6 traffic.
                properties:
                  hostInterfaces:
                    default:
                      create:
                        count: 1
                      strategy: Create
                    description: |-
                      HostInterfaces configures the host-side interfaces connecting to the target.
                      Defaults to a single interface created by the CNI plugin. It is immutable, since the daemon
                      cannot change the interfaces of a running target.
                    properties:
                      create:
                        description: Create configures the host-side interfaces created
                          by the daemon. Only used when Strategy is Create.
                        properties:
                          count:
                            default: 1
                            description: Count is the number of host-side interfaces
                              that will connect to the P4 target's namespace.
                            format: int32
                            minimum: 1
                            type: integer
                        type: object
                      reuse:
                        description: Reuse lists the existing host-side interfaces
                          to attach to. Only used when Strategy is Reuse.
                        properties:
                          names:
                            description: Names of the existing host-side interfaces
                              used to route the traffic to the target.
                            items:
                              type: string
                            minItems: 1
                            type: array
                            x-kubernetes-list-type: set
                        required:
                        - names
                        type: object
                      reuseMapped:
                        description: ReuseMapped maps existing host-side interfaces
                          to each other. Only used when Strategy is ReuseMapped.
                        properties:
                          ifacepairs:
                            description: host-side interface pairs which represent
                              toVNF (In) and fromVNF (Out) ports
                            items:
                              description: |-
                                NfIfacePairs are used to describe a mapping between host-side interfaces representing in and out ports of the NF.
                                The NF should adhere to this mapping internally.
                                e.g. if nfPair = { In: "eth0", Out: "eth1" }, the NF should return traffic received from eth0 through eth1.
                              properties:
                                in:
                                  description: In is the interface for traffic towards
                                    the network function.
                                  type: string
                                out:
                                  description: Out is the interface for traffic returning
                                    from the network function.
                                  type: string
                              required:
                              - in
                              - out
                              type: object
                            minItems: 1
                            type: array
                            x-kubernetes-list-type: atomic
                        required:
                        - ifacepairs
                        type: object
                      strategy:
                        default: Create
                        description: Strategy defines whether the daemon creates new
                          host-side interfaces or reuses existing ones.
                        enum:
                        - Create
                        - Reuse
                        - ReuseMapped
                        type: string
                    type: object
                    x-kubernetes-validations:
                    - message: hostInterfaces is immutable
                      rule: self == oldSelf
                    - message: create must only be set when strategy is Create
                      rule: 'self.strategy != ''Create'' ? !has(self.create) : true'
                    - message: reuse must be set if and only if strategy is Reuse
                      rule: (self.strategy == 'Reuse') == has(self.reuse)
                    - message: reuseMapped must be set if and only if strategy is
                        ReuseMapped
                      rule: (self.strategy == 'ReuseMapped') == has(self.reuseMapped)
                  srv6:
                    description: SRv6 configures how SRv6 is handled for the network
                      functions running on the target.
                    properties:
                      mode:
                        default: Native
                        description: |-
                          Mode selects who applies the SRv6 End behavior. Either way, IPv6 must be enabled
                          on the P4 target for SRv6 to work.
                        enum:
                        - Native
                        - Proxy
                        type: string
                      proxy_config:
                        description: ProxyConfig only applies if Mode == Proxy
                        properties:
                          fields:
                            description: only applies if Strategy FieldBased
                            items:
                              properties:
                                field:
                                  description: valid fieldnames are the canonical
                                    header field names defined in the RFCs mentioned
                                    below.
                                  type: string
                                match:
                                  properties:
                                    bitmask:
                                      type: string
                                    name:
                                      type: string
                                  required:
                                  - bitmask
                                  - name
                                  type: object
                                proto:
                                  type: string
                              required:
                              - field
                              - match
                              - proto
                              type: object
                            type: array
                          laneCount:
                            description: |-
                              indicates how many interface pairs to use: expects ReuseMappedHostInterfaces
                              with at least LaneCount * 2 ifaces
                            type: integer
                          proxyStrategy:
                            enum:
                            - Dynamic
                            - LaneBased
                            - FieldBased
                            type: string
                        required:
                        - proxyStrategy
                        type: object
                    type: object
                type: object
              nfCIDR:
                description: NfCIDR is the range assigned to the network functions
                  running on this target.
                type: string
              taints:
                description: |-
                  Taints represents the taints applied to the P4 target, which can affect
                  scheduling and operation of network functions on it.
                items:
                  properties:
                    effect:
                      type: string
                    key:
                      type: string
                    timeAdded:
                      format: date-time
                      type: string
                    value:
                      type: string
                  required:
                  - effect
                  - key
                  type: object
                type: array
              targetDataplaneIPs:
                description: TargetDataplaneIPs are the IPs of the programmable target.
                  They can be either in-cluster or public-facing IPs.
                items:
                  type: string
                type: array
              unschedulable:
                description: Unschedulable indicates whether the P4 target is unschedulable
                  for new network functions.
                type: boolean
            type: object
          status:
            description: status defines the observed state of P4Target
            properties:
              allocatable:
                additionalProperties:
                  anyOf:
                  - type: integer
                  - type: string
                  pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                  x-kubernetes-int-or-string: true
                description: Allocatable represents the resources of the P4 target
                  that are available for allocation
                type: object
              capacity:
                additionalProperties:
                  anyOf:
                  - type: integer
                  - type: string
                  pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                  x-kubernetes-int-or-string: true
                description: Capacity represents the total resources of the P4 target
                type: object
              conditions:
                items:
                  description: |-
                    P4TargetCondition represents the state of a specific aspect of the P4 target,
                    such as its readiness or health status.
                  properties:
                    lastHeartbeatTime:
                      format: date-time
                      type: string
                    lastTransitionTime:
                      format: date-time
                      type: string
                    message:
                      type: string
                    reason:
                      type: string
                    status:
                      type: string
                    type:
                      type: string
                  required:
                  - status
                  - type
                  type: object
                type: array
              driverIPs:
                description: DriverIPs are the detected IPs that were assigned to
                  the programmable target's driver.
                items:
                  type: string
                type: array
              nodeName:
                description: NodeName is the name of the Kubernetes node that the
                  P4 target is associated with, if any.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
