---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: p4targets.core.loom.io
spec:
  group: core.loom.io
  names:
    kind: P4Target
    listKind: P4TargetList
    plural: p4targets
    shortNames:
    - targets
    - target
    singular: p4target
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: P4Target is the Schema for the p4targets API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of P4Target
            properties:
              attachment:
                description: Attachment describes how the target is attached to loom's
                  dataplane on its node.
                properties:
                  type:
                    default: Container
                    description: |-
                      Type is the kind of attachment.

                      Container (default): the target is a container attached to the node's routing bridge through
                      loom's CNI, and the daemon routes the NfCIDR towards status.targetIPs.

                      HostVRF: the target is a VRF in the host network namespace. The daemon creates and owns the VRF,
                      connects it to the routing VRF with a veth pair, and reports it in status.hostVRF. It routes the
                      NfCIDR into the VRF, installs an unreachable route for the NfCIDR inside it (so unprogrammed
                      addresses are dropped instead of looping) and a default route back to the routing VRF.
                      Contract for the plugin: everything inside the VRF is the plugin's business, and everything wired
                      to the VRF shares its lifetime. When the VRF is torn down (P4Target deletion or daemon restart)
                      the daemon deletes every interface whose chain of masters leads to the VRF (e.g. the ports of a
                      bridge inside the VRF), releasing physical ones instead, and flushes its routing table. The plugin
                      must therefore wire every interface it creates to the VRF, need not clean them up itself, and must
                      re-create its interfaces and routes whenever the VRF is re-created (e.g. when status.hostVRF
                      changes). Interfaces in the VRF other than the daemon's veth must have a conntrack zone rule
                      matching status.hostVRF.table, added by the plugin.
                    enum:
                    - Container
                    - HostVRF
                    type: string
                type: object
              nfCIDR:
                description: NfCIDR is the range assigned to the network functions
                  running on this target.
                type: string
              taints:
                description: |-
                  Taints represents the taints applied to the P4 target, which can affect
                  scheduling and operation of network functions on it.
                items:
                  properties:
                    effect:
                      type: string
                    key:
                      type: string
                    timeAdded:
                      format: date-time
                      type: string
                    value:
                      type: string
                  required:
                  - effect
                  - key
                  type: object
                type: array
              unschedulable:
                description: Unschedulable indicates whether the P4 target is unschedulable
                  for new network functions.
                type: boolean
            type: object
          status:
            description: status defines the observed state of P4Target
            properties:
              allocatable:
                additionalProperties:
                  anyOf:
                  - type: integer
                  - type: string
                  pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                  x-kubernetes-int-or-string: true
                description: Allocatable represents the resources of the P4 target
                  that are available for allocation
                type: object
              capacity:
                additionalProperties:
                  anyOf:
                  - type: integer
                  - type: string
                  pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                  x-kubernetes-int-or-string: true
                description: Capacity represents the total resources of the P4 target
                type: object
              conditions:
                items:
                  description: |-
                    P4TargetCondition represents the state of a specific aspect of the P4 target,
                    such as its readiness or health status.
                  properties:
                    lastHeartbeatTime:
                      format: date-time
                      type: string
                    lastTransitionTime:
                      format: date-time
                      type: string
                    message:
                      type: string
                    reason:
                      type: string
                    status:
                      type: string
                    type:
                      type: string
                  required:
                  - status
                  - type
                  type: object
                type: array
              driverIPs:
                description: DriverIPs are the detected IPs that were assigned to
                  the programmable target's driver.
                items:
                  type: string
                type: array
              hostVRF:
                description: HostVRF is the VRF created by the daemon for a target
                  with a HostVRF attachment.
                properties:
                  addresses:
                    description: Addresses are the IPs of Interface.
                    items:
                      type: string
                    type: array
                  gateways:
                    description: Gateways are the IPs of the routing-VRF side of the
                      veth pair, used as the VRF's default gateway.
                    items:
                      type: string
                    type: array
                  interface:
                    description: Interface is the VRF-side end of the veth pair connecting
                      the VRF to the routing VRF.
                    type: string
                  name:
                    description: Name is the name of the VRF device.
                    type: string
                  table:
                    description: Table is the routing table bound to the VRF.
                    format: int32
                    type: integer
                required:
                - interface
                - name
                - table
                type: object
              nodeName:
                description: NodeName is the name of the Kubernetes node that the
                  P4 target is associated with, if any.
                type: string
              targetIPs:
                description: TargetIPs are the detected IPs of the programmable target.
                  They can be either in-cluster or public-facing IPs.
                items:
                  type: string
                type: array
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
