              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of Service
            properties:
              ports:
                description: Ports exposed by the Service.
                items:
                  description: ServicePort describes a port exposed by a Service.
                  properties:
                    name:
                      description: |-
                        Name of this port. Must be a DNS_LABEL and unique within the Service
