name: 'Test, build, publish'

on:
  push:
    branches: [ main ]
    tags:
      - "v*"
    paths: &paths
      - go.work
      - go.work.sum
      - cni/**
      - api/**
      - daemon/**
      - dpcs/**
      - dns/**
      - operator/**
      - targets/bmv2/**
      - .github/workflows/**
      - Dockerfile
      - docker-bake.hcl
  pull_request:
    branches: [ main ]
    paths: *paths

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-build-and-push-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      MODULES: '["cni", "daemon", "operator", "targets-bmv2"]'
      # Every module is tested on every run so the merged coverage report is complete.
      TEST_MODULES: '["cni", "daemon", "dpcs", "dns", "operator", "targets-bmv2"]'
      GOVERSION: 1.26.1

    steps:
      - name: Generate bake targets
        id: targets
        env:
          MODULES: ${{ env.MODULES }}
        run: |
          echo "tests=$(jq -cn --jsonargs \
            '$ARGS.positional[] | map("test-" + .) | join(",")' \
            "$TEST_MODULES")" >> "$GITHUB_OUTPUT"
          echo "images=$(jq -cn --jsonargs \
            '$ARGS.positional[] | map("image-" + .) | join(",")' \
            "$MODULES")" >> "$GITHUB_OUTPUT"

      - name: Docker meta
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/__target__
          tags: |
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Log in to ghcr
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          # The runner is discarded after the job; removing the builder only costs time.
          cleanup: false

      - name: Checkout for hashfiles
        uses: actions/checkout@v7

      # Two go caches with different lifetimes:
      #  - go-mod only changes with go.sum, so it is keyed on the workspace go.sum files.
      #  - go-build changes with every source change, so it uses a rolling per-commit
      #    key; with a go.sum key it would only be saved on dependency bumps and go stale.
      # actions/cache saves in its post step, which runs after the cache-dance post
      # steps have extracted the mounts. PR caches are deleted on close (cache-cleanup.yml).
      - name: Restore go module cache
        uses: actions/cache@v6
        id: go-mod-cache
        with:
          key: ${{ runner.os }}-gomod-${{ hashFiles('go.work.sum', 'api/go.sum', 'cni/go.sum', 'daemon/go.sum', 'dpcs/go.sum', 'dns/go.sum', 'operator/go.sum', 'tools/go.sum', 'targets/bmv2/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-gomod-
          path: cache-go-mod

      - name: Restore go build cache
        uses: actions/cache@v6
        id: go-build-cache
        with:
          key: ${{ runner.os }}-gobuild-${{ env.GOVERSION }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-gobuild-${{ env.GOVERSION }}-
          path: cache-go-build

      # One cache-dance per cache so each is only extracted when it will be saved:
      # the (large) module cache is skipped whenever go.sum is unchanged.
      - name: Inject go module cache
        uses: reproducible-containers/buildkit-cache-dance@v3.4.0
        with:
          scratch-dir: scratch-go-mod
          skip-extraction: ${{ steps.go-mod-cache.outputs.cache-hit }}
          cache-map: |
            {"cache-go-mod": {"target": "/go/pkg/mod", "id": "go-mod"}}

      - name: Inject go build cache
        uses: reproducible-containers/buildkit-cache-dance@v3.4.0
        with:
          scratch-dir: scratch-go-build
          skip-extraction: ${{ steps.go-build-cache.outputs.cache-hit }}
          cache-map: |
            {"cache-go-build": {"target": "/root/.cache/go-build", "id": "go-build"}}

      - name: Run tests
        id: tests
        uses: docker/bake-action@v7
        with:
          push: false
          files: |
            ./docker-bake.hcl
            cwd://${{ steps.metadata.outputs.bake-file }}
          targets: ${{ steps.targets.outputs.tests }}

      - name: Generate unit test summary
        if: steps.tests.outcome == 'success'
        id: summary
        uses: test-summary/action@v2
        with:
          paths: "artifacts/*.unit-tests.xml"

      - name: Fail if tests failed
        if: steps.tests.outcome == 'success' && steps.summary.outputs.failed != '0'
        run: exit 1

      - name: Build and push images
        uses: docker/bake-action@v7
        with:
          push: ${{ github.event_name != 'pull_request' }}
          files: |
            ./docker-bake.hcl
            cwd://${{ steps.metadata.outputs.bake-file }}
          targets: ${{ steps.targets.outputs.images }}

      # Coverage reporting runs after the images so it neither delays nor blocks them.
      - name: Generate coverage summary
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: "./artifacts/*.coverage.xml"
          format: markdown
          output: file

      - name: Upload coverage as artifact
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          path: "artifacts/*.coverage.html"

      - name: Write coverage to job summary
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        run: cat ./code-coverage-results.md >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Go for coverage merge
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        uses: actions/setup-go@v7
        with:
          go-version-file: 'tools/go.mod'
          cache-dependency-path: 'tools/go.sum'

      - name: Merge coverage profiles
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        run: make coverage-merge

      - name: Upload coverage to Coveralls
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: artifacts/coverage.lcov
          format: lcov
          # A reporting outage must not fail the run after images were pushed.
          fail-on-error: false
        env:
          COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}

  publish-chart:
    if: github.ref_type == 'tag'
    needs: test-build-and-push-images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout files
        uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: 'tools/go.mod'
          cache-dependency-path: 'tools/go.sum'

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: 4.1.4

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login ghcr.io \
              --username "${{ github.actor }}" \
              --password-stdin

      - name: Generate manifests and push helm chart
        run: |
          export VERSION="${GITHUB_REF_NAME#v}"
          export REPO="ghcr.io/${{ github.repository }}"
          export IMG_OPERATOR="${REPO}/operator:${VERSION}"
          export IMG_DAEMON="${REPO}/daemon:${VERSION}"
          export IMG_CNI="${REPO}/cni:${VERSION}"
          export IMG_BMV2_CP="${REPO}/targets-bmv2:${VERSION}"

          make build-installer
          mkdir -p chart/templates
          cp install.yaml chart/templates/

          helm package chart --version ${VERSION} --app-version ${VERSION} --destination dist
          helm push dist/*.tgz oci://ghcr.io/${{ github.repository }}/charts
