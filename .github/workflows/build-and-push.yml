name: 'Test go modules, build images and publish helm chart'

on:
  push:
    branches: [ main ]
    tags:
      - "v*"
    paths: &paths
      - go.work
      - go.work.sum
      - cni/**
      - api/**
      - daemon/**
      - operator/**
      - targets/bmv2/**
  pull_request:
    branches: [ main ]
    paths: *paths

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      images: ${{ steps.filter.outputs.changes }}
    steps:
    - uses: actions/checkout@v7
    - uses: dorny/paths-filter@v4
      id: filter
      with:
        filters: |
          cni: ['cni/**', 'api/**', 'go.work', 'go.work.sum']
          daemon: ['daemon/**', 'api/**', 'go.work', 'go.work.sum']
          operator: ['operator/**', 'api/**', 'go.work', 'go.work.sum']
          targets-bmv2: ['targets/bmv2/**', 'api/**', 'go.work', 'go.work.sum']

  test-build-and-push-images:
    runs-on: ubuntu-latest
    needs: changes
    permissions:
      contents: read
      packages: write
    env:
      MODULES: '["cni", "daemon", "operator", "targets-bmv2"]'
      CHANGED: ${{ needs.changes.outputs.images }}
      GOVERSION: 1.26.1
      GITHUB_EVENT_NAME: ${{ github.event_name }}

    steps:
      - name: Generate bake targets
        id: targets
        env:
          MODULES: ${{ env.MODULES }}
        run: |
          echo "tests=$(jq -cn --jsonargs \
            '$ARGS.positional[] | map("test-" + .) | join(",")' \
            "$CHANGED")" >> "$GITHUB_OUTPUT"
          echo "images=$(jq -cn --jsonargs \
            '$ARGS.positional[] | map("image-" + .) | join(",")' \
            "$MODULES")" >> "$GITHUB_OUTPUT"

      - name: Docker meta
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/__target__
          tags: |
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Log in to ghcr
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Checkout for hashfiles
        uses: actions/checkout@v7

      - name: Restore cache for go modules and build
        #uses: actions/cache/restore@v6
        uses: actions/cache@v6
        id: go-cache
        with:
          key: ${{ runner.os }}-go-${{ env.GOVERSION }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ env.GOVERSION }}-
            ${{ runner.os }}-go-
          path: |
            cache-go-mod
            cache-go-build

      - name: Restore cache mounts
        uses: reproducible-containers/buildkit-cache-dance@v3.4.0
        with:
          skip-extraction: ${{ steps.go-cache.outputs.cache-hit }}
          cache-map: |
            {
              "cache-go-mod": {"target": "/go/pkg/mod", "id": "go-mod"},
              "cache-go-build": {"target": "/root/.cache/go-build", "id": "go-build"}
            }

      - name: Clear cache source dir workaround
        run: |
          sudo rm -rf cache-go-mod/

      - name: Run tests
        uses: docker/bake-action@v7
        with:
          push: false
          files: |
            ./docker-bake.hcl
            cwd://${{ steps.metadata.outputs.bake-file }}
          targets: ${{ steps.targets.outputs.tests }}

      - name: Generate unit test summary
        id: summary
        uses: test-summary/action@v2
        with:
          paths: "artifacts/*.unit-tests.xml"

      - name: Generate coverage summary
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: "./artifacts/*.coverage.xml"
          format: markdown
          output: file

      - name: Upload coverage as artifact
        uses: actions/upload-artifact@v7
        with:
          path: "artifacts/*.coverage.html"

      - name: Write coverage to job summary
        run: cat ./code-coverage-results.md >> $GITHUB_STEP_SUMMARY

      #- name: Fail if tests failed
      #  if: steps.summary.outputs.failed != '0'
      #  run: exit 1

      - name: Build and push images
        uses: docker/bake-action@v7
        with:
          push: ${{ github.event_name != 'pull_request' }}
          files: |
            ./docker-bake.hcl
            cwd://${{ steps.metadata.outputs.bake-file }}
          targets: ${{ steps.targets.outputs.images }}

      #- uses: actions/cache/save@v6
      #  if: github.event_name != 'pull_request'
      #  with:
      #    key: ${{ steps.go-cache.outputs.cache-primary-key }}
      #    path: |
      #      cache-go-mod
      #      cache-go-build

  publish-chart:
    if: github.ref_type == 'tag'
    needs: test-build-and-push-images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout files
        uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: 'tools/go.mod'
          cache-dependency-path: 'tools/go.sum'

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: 4.1.4

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login ghcr.io \
              --username "${{ github.actor }}" \
              --password-stdin

      - name: Generate manifests and push helm chart
        run: |
          export VERSION="${GITHUB_REF_NAME#v}"
          export REPO="ghcr.io/${{ github.repository }}"
          export IMG_OPERATOR="${REPO}/operator:${VERSION}"
          export IMG_DAEMON="${REPO}/daemon:${VERSION}"
          export IMG_CNI="${REPO}/cni:${VERSION}"
          export IMG_BMV2_CP="${REPO}/targets-bmv2:${VERSION}"

          make build-installer
          mkdir -p chart/templates
          cp install.yaml chart/templates/

          helm package chart --version ${VERSION} --app-version ${VERSION} --destination dist
          helm push dist/*.tgz oci://ghcr.io/${{ github.repository }}/charts
