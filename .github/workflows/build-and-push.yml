name: 'Build container images'

on:
  push:
    branches: [ main ]
    paths: &paths
      - go.work
      - go.work.sum
      - cni/**
      - api/**
      - daemon/**
      - operator/**
      - targets/bmv2/**
  pull_request:
    branches: [ main ]
    paths: *paths

jobs:
  # changes:
  #   runs-on: ubuntu-latest
  #   permissions:
  #     pull-requests: read
  #   outputs:
  #     images: ${{ steps.filter.outputs.changes }}
  #   steps:
  #   - uses: actions/checkout@v6
  #   - uses: dorny/paths-filter@v4
  #     id: filter
  #     with:
  #       filters: |
  #         cni: ['cni/**', 'api/**', 'go.work', 'go.work.sum']
  #         daemon: ['daemon/**', 'api/**', 'go.work', 'go.work.sum']
  #         operator: ['operator/**', 'api/**', 'go.work', 'go.work.sum']

  build-and-push:
    runs-on: ubuntu-latest
    # needs: changes
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        # target: ${{ fromJSON(needs.changes.outputs.images) }}
        target: ['cni', 'daemon', 'operator', 'bmv2']
    steps:
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.target }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Log in to ghcr
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      #- name: Set up QEMU
      #  uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64 # ,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          target: ${{ matrix.target }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
