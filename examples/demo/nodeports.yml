---
apiVersion: v1
kind: Service
metadata:
  name: web-service
spec:
  type: NodePort
  selector:
    app: local-web-proxy
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30007
---
apiVersion: v1
kind: Service
metadata:
  name: streaming-service
spec:
  type: NodePort
  selector:
    app: local-streaming-proxy
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30008
