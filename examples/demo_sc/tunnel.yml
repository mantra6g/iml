---
apiVersion: core.loom.io/v1alpha1
kind: NetworkFunction
metadata:
  name: tunnel-ingress
  namespace: default
  labels:
    nf: tunnel-ingress
spec:
  p4File: "https://raw.githubusercontent.com/mantra6g/iml/43f905955362734eeb0603f077688a994dd83f1a/examples/demo_sc/tunnel/tunnel_vxlan.p4"
  targetName: bmv2-target-3
  configRef:
    name: ingress-config
  targetSelector:
    p4target.loom.io/arch: v1model
---
apiVersion: core.loom.io/v1alpha1
kind: NetworkFunction
metadata:
  name: tunnel-egress
  namespace: default
  labels:
    nf: tunnel-egress
spec:
  p4File: "https://raw.githubusercontent.com/mantra6g/iml/43f905955362734eeb0603f077688a994dd83f1a/examples/demo_sc/tunnel/tunnel_vxlan.p4"
  targetName: bmv2-target-4
  configRef:
    name: egress-config
  targetSelector:
    p4target.loom.io/arch: v1model
---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: vxlan-ingress
  namespace: loom-system
spec:
  config: '{
    "cniVersion": "0.3.1",
    "plugins": [{
      "name": "vxlan-ingress",
      "type": "macvlan",
      "master": "enp3s0",
      "mode": "bridge",
      "ipam": {
        "type": "static"
      }
    }, {
      "capabilities": { "mac": true },
      "type": "tuning"
    }]
  }'
---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: vxlan-egress
  namespace: loom-system
spec:
  config: '{
    "cniVersion": "0.3.1",
    "plugins": [{
      "name": "vxlan-egress",
      "type": "macvlan",
      "master": "enp3s0",
      "mode": "bridge",
      "ipam": {
        "type": "static"
      }
    }, {
      "capabilities": { "mac": true },
      "type": "tuning"
    }]
  }'
---
apiVersion: core.loom.io/v1alpha1
kind: NetworkFunctionConfig
metadata:
  name: ingress-config
  namespace: default
spec:
  tables:
    MyIngress.vtep_src:
      entries: []
      defaultAction:
        name: MyIngress.set_vtep_src_ip
        parameters:
          - name: vtep_src_ip
            ipv4Address: "10.0.0.51"
    MyIngress.vtep_dst:
      entries: []
      defaultAction:
        name: MyIngress.set_vtep_dst_ip
        parameters:
          - name: vtep_dst_ip
            ipv4Address: "10.0.0.52"
          - name: smac
            macAddress: "02:f7:62:85:a4:77"
          - name: dmac
            macAddress: "02:f7:62:85:a4:78"
---
apiVersion: core.loom.io/v1alpha1
kind: NetworkFunctionConfig
metadata:
  name: egress-config
  namespace: default
spec:
  tables:
    MyIngress.vxlan_fwd:
      entries: []
      defaultAction:
        name: MyIngress.vxlan_decap
        parameters:
          - name: egress_dst_mac
            macAddress: "02:f7:62:85:a4:80"
---
apiVersion: infra.loom.io/v1alpha1
kind: BMv2Target
metadata:
  name: bmv2-target-3
spec:
  additionalInterfaces: ['{
    "interface":"vxlan",
    "name":"vxlan-ingress",
    "mac":"02:f7:62:85:a4:77",
    "ips":["10.0.0.51/24"]
  }']
  affinity:
    podAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            app: web-client
        namespaces:
        - default
        topologyKey: "kubernetes.io/hostname"
  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"
---
apiVersion: infra.loom.io/v1alpha1
kind: BMv2Target
metadata:
  name: bmv2-target-4
spec:
  additionalInterfaces: ['{
    "interface":"vxlan",
    "name":"vxlan-egress",
    "mac":"02:f7:62:85:a4:78",
    "ips":["10.0.0.52/24"]
  }']
  initCmd: "ip link set dev nf0-pipe address 02:f7:62:85:a4:80"
  affinity:
    podAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            app: web-server
        namespaces:
        - default
        topologyKey: "kubernetes.io/hostname"
  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"
