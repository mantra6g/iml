apiVersion: core.loom.io/v1alpha1
kind: Application
metadata:
  name: web-client
  namespace: default
spec: {}
---
apiVersion: core.loom.io/v1alpha1
kind: Application
metadata:
  name: web-server
  namespace: default
spec: {}
---
apiVersion: core.loom.io/v1alpha1
kind: Application
metadata:
  name: dummy-web-server
  namespace: default
spec: {}
---
apiVersion: core.loom.io/v1alpha1
kind: NetworkFunction
metadata:
  name: load-balancer
  namespace: default
  labels:
    nf: load-balancer
spec:
  p4File: "https://raw.githubusercontent.com/mantra6g/iml/refs/heads/load-balancer-example/examples/load-balancer/lb.p4"
  configRef:
    name: lb-config
  targetSelector:
    p4target.loom.io/arch: v1model
---
apiVersion: infra.loom.io/v1alpha1
kind: BMv2Target
metadata:
  name: bmv2-target
spec:
  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"
---
apiVersion: core.loom.io/v1alpha1
kind: ServiceChain
metadata:
  name: load-balance-webserver
  namespace: default
spec:
  from:
    name: web-client
    namespace: default
  to:
    name: dummy-web-server
    namespace: default
  functions:
    - matchLabels:
        nf: load-balancer
---
apiVersion: core.loom.io/v1alpha1
kind: ServiceChain
metadata:
  name: return-traffic-to-client
  namespace: default
spec:
  from:
    name: dummy-web-server
    namespace: default
  to:
    name: web-client
    namespace: default
  functions:
    - matchLabels:
        nf: load-balancer
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lb-controller-sa
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: lb-controller-role
  namespace: default
rules:
  # Allow access to Pods
  - apiGroups: [""]
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - core.loom.io
    resources:
      - networkfunctionconfigs
    verbs:
      - get
      - list
      - watch
      - update
      - patch
      - create
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lb-controller-rolebinding
  namespace: default
subjects:
  - kind: ServiceAccount
    name: lb-controller-sa
    namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: lb-controller-role
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lb-controller
  namespace: default
spec:
  selector:
    matchLabels:
      app: lb-controller
  template:
    metadata:
      labels:
        app: lb-controller
    spec:
      serviceAccountName: lb-controller-sa
      affinity:
        podAntiAffinity:
          # This changed from 'required' to 'preferred'
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - web-server
                topologyKey: "kubernetes.io/hostname"
      containers:
        - name: lb-controller
          image: tomasagata/lb-controller:latest
          imagePullPolicy: Never
          args: [
            "--config-name", "lb-config",
            "--config-namespace", "default",
            "--app-label", "app",
            "--dummy-app-label-value", "dummy-web-server",
            "--lb-app-label-value", "web-server"
          ]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-client
  namespace: default
spec:
  replicas: 3
  selector:
    matchLabels:
      app: web-client
  template:
    metadata:
      labels:
        app: web-client
      annotations:
        k8s.v1.cni.cncf.io/networks: |
          [
            {
              "name": "loom-cni",
              "namespace": "loom-system",
              "cni-args": {
                "app_type": "application",
                "app_name": "web-client",
                "app_namespace": "default"
              }
            }
          ]
    spec:
      affinity:
        podAntiAffinity:
          # This changed from 'required' to 'preferred'
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - web-server
                topologyKey: "kubernetes.io/hostname"
      containers:
        - name: web-client
          image: alpine:3.20
          command: ["/bin/sh", "-c", "trap : TERM INT; sleep infinity & wait"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-server
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-server
  template:
    metadata:
      labels:
        app: web-server
      annotations:
        k8s.v1.cni.cncf.io/networks: |
          [
            {
              "name": "loom-cni",
              "namespace": "loom-system",
              "cni-args": {
                "app_type": "application",
                "app_name": "web-server",
                "app_namespace": "default"
              }
            }
          ]
    spec:
      containers:
        - name: server
          image: tomasagata/lb-server:latest
          imagePullPolicy: Never
          securityContext:
            privileged: true
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - containerPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dummy-web-server
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dummy-web-server
  template:
    metadata:
      labels:
        app: dummy-web-server
      annotations:
        k8s.v1.cni.cncf.io/networks: |
          [
            {
              "name": "loom-cni",
              "namespace": "loom-system",
              "cni-args": {
                "app_type": "application",
                "app_name": "dummy-web-server",
                "app_namespace": "default"
              }
            }
          ]
    spec:
      affinity:
        podAntiAffinity:
          # This changed from 'required' to 'preferred'
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - web-server
                topologyKey: "kubernetes.io/hostname"
      containers:
        - name: alpine
          image: alpine:3.20
          command: ["/bin/sh", "-c", "trap : TERM INT; sleep infinity & wait"]
---
apiVersion: core.loom.io/v1alpha1
kind: NetworkFunctionConfig
metadata:
  name: lb-config
  namespace: default
spec: {}
