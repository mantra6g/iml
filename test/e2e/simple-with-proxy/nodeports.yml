---
apiVersion: v1
kind: Service
metadata:
  name: web-service
spec:
  type: NodePort
  selector:
    app: local-web-proxy
  ports:
    - name: iperf3-tcp
      protocol: TCP
      port: 3000
      targetPort: 3000
      nodePort: 30007
    - name: iperf3-udp
      protocol: UDP
      port: 3000
      targetPort: 3000
      nodePort: 30007
