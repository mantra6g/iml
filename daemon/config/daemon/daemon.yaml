apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: daemon
  namespace: system
  labels:
    app.kubernetes.io/name: loom-daemon
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: loom-daemon
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: daemon
      labels:
        app.kubernetes.io/name: loom-daemon
    spec:
      dnsPolicy: ClusterFirstWithHostNet
      hostNetwork: true
      initContainers:
        # Mounts bpffs on the host if it isn't already (e.g. on kind nodes). The mount must reach the host,
        # hence Bidirectional, so the daemon's container sees it and the pinned objects outlive the pod.
        - name: mount-bpffs
          image: daemon:latest # Used just for the mount command, so any image with /bin/sh would work.
          command:
            - /bin/sh
            - -c
            - |
              grep -q '^[^ ]* /sys/fs/bpf bpf ' /proc/mounts || mount -t bpf bpffs /sys/fs/bpf
          securityContext:
            privileged: true
          volumeMounts:
            - name: bpffs
              mountPath: /sys/fs/bpf
              mountPropagation: Bidirectional
        - name: cni-installer
          image: cni:latest
          command:
            - /bin/sh
            - -c
            - |
              cp /app /host/opt/cni/bin/loom
              chmod +x /host/opt/cni/bin/loom
          securityContext:
            privileged: true
          volumeMounts:
            - name: cni-bin
              mountPath: /host/opt/cni/bin
      containers:
        - name: daemon
          image: daemon:latest
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          volumeMounts:
            - name: iml-config
              mountPath: /etc/iml/config
              readOnly: true
            # The host's bpffs, so the eBPF programs and maps pinned for P4Targets outlive the daemon's container.
            - name: bpffs
              mountPath: /sys/fs/bpf
              mountPropagation: HostToContainer
      volumes:
        - name: cni-bin
          hostPath:
            path: /opt/cni/bin
        - name: bpffs
          hostPath:
            path: /sys/fs/bpf
            type: Directory
        - name: iml-config
          configMap:
            name: loom-iml-config
      serviceAccountName: daemon-sa
